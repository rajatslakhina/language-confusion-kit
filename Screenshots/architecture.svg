<text x="745.0" y="114" fill="#f8fafc" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">LanguageIdentifying</text>
<text x="745.0" y="136" fill="#cbd5e1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">LexicalIdentifier&#160;(20)</text>
<text x="745.0" y="154" fill="#cbd5e1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">NaturalLanguageIdentifier</text>
<text x="745.0" y="172" fill="#cbd5e1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">AgreeingIdentifier</text>
<text x="745.0" y="190" fill="#cbd5e1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">declines&#160;when&#160;unsure</text>
<rect x="640" y="250" width="210" height="110" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
<text x="745.0" y="274" fill="#f8fafc" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">StrayScanner</text>
<text x="745.0" y="296" fill="#cbd5e1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">English&#160;words&#160;in&#160;a</text>
<text x="745.0" y="314" fill="#cbd5e1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">non-Latin&#160;answer;</text>
<text x="745.0" y="332" fill="#cbd5e1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">letters&#160;of&#160;a&#160;foreign&#160;script</text>
<rect x="900" y="90" width="170" height="270" rx="8" fill="#1e293b" stroke="#22c55e" stroke-width="1.5"/>
<text x="985.0" y="114" fill="#f8fafc" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">LanguageReport</text>
<text x="985.0" y="136" fill="#cbd5e1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">verdict:</text>
<text x="985.0" y="154" fill="#cbd5e1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">matched</text>
<text x="985.0" y="172" fill="#cbd5e1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">strayWords</text>
<text x="985.0" y="190" fill="#cbd5e1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">mixedSentences</text>
<text x="985.0" y="208" fill="#cbd5e1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">wrongLanguage</text>
<text x="985.0" y="226" fill="#cbd5e1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">unjudged</text>
<text x="985.0" y="244" fill="#cbd5e1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">noExpectation</text>
<text x="985.0" y="262" fill="#cbd5e1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">linePass&#160;/&#160;wordPass</text>
<text x="985.0" y="280" fill="#cbd5e1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">note&#160;+&#160;feedback</text>
<rect x="330" y="410" width="520" height="110" rx="8" fill="#1e293b" stroke="#a78bfa" stroke-width="1.5"/>
<text x="590.0" y="434" fill="#f8fafc" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">LanguageSession&#160;(actor)</text>
<text x="590.0" y="456" fill="#cbd5e1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">carries&#160;a&#160;standing&#160;request&#160;and&#160;the&#160;conversation's&#160;language,</text>
<text x="590.0" y="474" fill="#cbd5e1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">so&#160;&#34;ok,&#160;and&#160;the&#160;second&#160;one?&#34;&#160;is&#160;still&#160;expected&#160;in&#160;German</text>
<text x="590.0" y="492" fill="#cbd5e1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">totals:&#160;turns,&#160;sentences&#160;judged,&#160;wrong,&#160;stray&#160;words</text>
