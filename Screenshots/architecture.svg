<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560">
<rect width="1100" height="560" rx="12" fill="#0f172a"/>
<defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#94a3b8"/></marker></defs>
<text x="550" y="36" fill="#e2e8f0" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle">LanguageConfusionKit</text>
<text x="550" y="60" fill="#94a3b8" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle">is&#160;the&#160;answer&#160;in&#160;the&#160;language&#160;the&#160;question&#160;calls&#160;for?&#160;sentence&#160;by&#160;sentence,&#160;word&#160;by&#160;word</text>
<rect x="30" y="90" width="240" height="96" rx="8" fill="#1e293b" stroke="#a78bfa" stroke-width="1.5"/>
<text x="150.0" y="114" fill="#f8fafc" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">ProviderGatewayKit</text>
<text x="150.0" y="136" fill="#cbd5e1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">sends&#160;the&#160;turn</text>
<text x="150.0" y="154" fill="#cbd5e1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">returns&#160;the&#160;answer&#160;text</text>
<rect x="30" y="230" width="240" height="116" rx="8" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
<text x="150.0" y="254" fill="#f8fafc" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">question&#160;+&#160;answer</text>
<text x="150.0" y="276" fill="#cbd5e1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">&#34;Quelle&#160;est&#160;la&#160;diff&#233;rence</text>
<text x="150.0" y="294" fill="#cbd5e1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">entre&#160;une&#160;liste&#160;et&#160;un&#160;tuple&#160;?&#34;</text>
<text x="150.0" y="312" fill="#cbd5e1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">&#8594;&#160;&#34;Une&#160;liste&#160;est&#160;modifiable&#8230;</text>
<text x="150.0" y="330" fill="#cbd5e1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">In&#160;practice,&#160;you&#160;should&#8230;&#34;</text>
<rect x="330" y="90" width="250" height="130" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
<text x="455.0" y="114" fill="#f8fafc" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">ExpectationReader</text>
<text x="455.0" y="136" fill="#cbd5e1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">request:&#160;&#34;Answer&#160;in&#160;Spanish&#34;</text>
<text x="455.0" y="154" fill="#cbd5e1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">standing:&#160;&#34;from&#160;now&#160;on&#8230;&#34;</text>
<text x="455.0" y="172" fill="#cbd5e1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">mention:&#160;&#34;&#8230;in&#160;Japanese?&#34;&#160;(allowed)</text>
<text x="455.0" y="190" fill="#cbd5e1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">else:&#160;the&#160;message's&#160;language</text>
<rect x="330" y="250" width="250" height="110" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
<text x="455.0" y="274" fill="#f8fafc" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">TextPieces</text>
<text x="455.0" y="296" fill="#cbd5e1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">drops&#160;code,&#160;links,&#160;markup</text>
<text x="455.0" y="314" fill="#cbd5e1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">quotations&#160;&#8594;&#160;excused</text>
<text x="455.0" y="332" fill="#cbd5e1" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">splits&#160;into&#160;sentences</text>
