<text x="20" y="972" fill="#e2e8f0" font-family="Menlo, monospace" font-size="13">&#160;&#160;&#160;Q:&#160;How&#160;do&#160;you&#160;say&#160;thank&#160;you&#160;in&#160;Japanese?</text>
<text x="20" y="996" fill="#e2e8f0" font-family="Menlo, monospace" font-size="13">&#160;&#160;&#160;A:&#160;In&#160;Japanese&#160;you&#160;say&#160;&#12354;&#12426;&#12364;&#12392;&#12358;.&#160;For&#160;more&#160;politeness,&#160;say&#160;&#12393;&#12358;&#12418;&#12354;&#12426;&#12364;&#12392;&#12358;&#12372;&#12374;&#12356;&#12414;&#12377;.</text>
