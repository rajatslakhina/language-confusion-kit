<text x="20" y="828" fill="#fde68a" font-family="Menlo, monospace" font-size="13">&#160;&#160;&#160;note:&#160;This&#160;answer&#160;is&#160;in&#160;English,&#160;but&#160;you&#160;asked&#160;for&#160;an&#160;answer&#160;in&#160;Spanish.</text>
<text x="20" y="852" fill="#e2e8f0" font-family="Menlo, monospace" font-size="13">&#160;&#160;&#160;Q:&#160;Answer&#160;in&#160;Spanish:&#160;what&#160;is&#160;the&#160;capital&#160;of&#160;Australia?</text>
<text x="20" y="876" fill="#e2e8f0" font-family="Menlo, monospace" font-size="13">&#160;&#160;&#160;A:&#160;La&#160;capital&#160;de&#160;Australia&#160;es&#160;Canberra,&#160;no&#160;S&#237;dney.</text>
<text x="20" y="900" fill="#e2e8f0" font-family="Menlo, monospace" font-size="13">&#160;&#160;&#160;expected&#160;Spanish&#160;because&#160;you&#160;asked&#160;for&#160;an&#160;answer&#160;in&#160;Spanish</text>
<text x="20" y="924" fill="#bbf7d0" font-family="Menlo, monospace" font-size="13">&#160;&#160;&#160;ok,&#160;Spanish&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;La&#160;capital&#160;de&#160;Australia&#160;es&#160;Canberra,&#160;no&#160;S&#237;dney.</text>
