<text x="20" y="60" fill="#e2e8f0" font-family="Menlo, monospace" font-size="13">LanguageConfusionKit&#160;demo:&#160;is&#160;the&#160;answer&#160;in&#160;the&#160;language&#160;the&#160;question&#160;calls&#160;for?</text>
<text x="20" y="84" fill="#e2e8f0" font-family="Menlo, monospace" font-size="13">identifier:&#160;LexicalIdentifier&#160;(20&#160;languages,&#160;deterministic)</text>
<text x="20" y="108" fill="#e2e8f0" font-family="Menlo, monospace" font-size="13"></text>
<text x="20" y="132" fill="#7dd3fc" font-family="Menlo, monospace" font-size="13">&#9472;&#9472;&#160;1.&#160;The&#160;three&#160;shapes&#160;of&#160;language&#160;confusion:&#160;whole&#160;answer,&#160;some&#160;lines,&#160;some&#160;words</text>
<text x="20" y="156" fill="#e2e8f0" font-family="Menlo, monospace" font-size="13">&#160;&#160;&#160;Q:&#160;Quelle&#160;est&#160;la&#160;diff&#233;rence&#160;entre&#160;une&#160;liste&#160;et&#160;un&#160;tuple&#160;en&#160;Python&#160;?</text>
<text x="20" y="180" fill="#e2e8f0" font-family="Menlo, monospace" font-size="13">&#160;&#160;&#160;A:&#160;A&#160;list&#160;can&#160;change&#160;after&#160;you&#160;create&#160;it,&#160;but&#160;a&#160;tuple&#160;cannot&#160;change&#160;at&#160;all.</text>
<text x="20" y="204" fill="#e2e8f0" font-family="Menlo, monospace" font-size="13">&#160;&#160;&#160;expected&#160;French&#160;because&#160;you&#160;wrote&#160;in&#160;French</text>
<text x="20" y="228" fill="#fca5a5" font-family="Menlo, monospace" font-size="13">&#160;&#160;&#160;WRONG,&#160;English&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;A&#160;list&#160;can&#160;change&#160;after&#160;you&#160;create&#160;it,&#160;but&#160;a&#160;tuple&#160;cannot&#160;change&#160;at&#160;all.</text>
<text x="20" y="252" fill="#fca5a5" font-family="Menlo, monospace" font-size="13">&#160;&#160;&#160;verdict:&#160;wrongLanguage&#160;(line-level&#160;FAIL,&#160;word-level&#160;pass)</text>
<text x="20" y="276" fill="#fde68a" font-family="Menlo, monospace" font-size="13">&#160;&#160;&#160;note:&#160;This&#160;answer&#160;is&#160;in&#160;English,&#160;but&#160;you&#160;wrote&#160;in&#160;French.</text>
<text x="20" y="300" fill="#e2e8f0" font-family="Menlo, monospace" font-size="13">&#160;&#160;&#160;Q:&#160;Quelle&#160;est&#160;la&#160;diff&#233;rence&#160;entre&#160;une&#160;liste&#160;et&#160;un&#160;tuple&#160;en&#160;Python&#160;?</text>
<text x="20" y="324" fill="#e2e8f0" font-family="Menlo, monospace" font-size="13">&#160;&#160;&#160;A:&#160;Une&#160;liste&#160;est&#160;modifiable,&#160;alors&#160;qu'un&#160;tuple&#160;ne&#160;l'est&#160;pas.&#160;In&#160;practice,&#160;you&#160;should&#160;use&#160;a&#160;tuple&#160;when&#160;the&#160;data&#160;must&#8230;</text>
<text x="20" y="348" fill="#e2e8f0" font-family="Menlo, monospace" font-size="13">&#160;&#160;&#160;expected&#160;French&#160;because&#160;you&#160;wrote&#160;in&#160;French</text>
<text x="20" y="372" fill="#bbf7d0" font-family="Menlo, monospace" font-size="13">&#160;&#160;&#160;ok,&#160;French&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;Une&#160;liste&#160;est&#160;modifiable,&#160;alors&#160;qu'un&#160;tuple&#160;ne&#160;l'est&#160;pas.</text>
<text x="20" y="396" fill="#fca5a5" font-family="Menlo, monospace" font-size="13">&#160;&#160;&#160;WRONG,&#160;English&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;In&#160;practice,&#160;you&#160;should&#160;use&#160;a&#160;tuple&#160;when&#160;the&#160;data&#160;must&#160;not&#160;change.</text>
<text x="20" y="420" fill="#bbf7d0" font-family="Menlo, monospace" font-size="13">&#160;&#160;&#160;ok,&#160;French&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;Les&#160;deux&#160;peuvent&#160;contenir&#160;des&#160;&#233;l&#233;ments&#160;de&#160;types&#160;diff&#233;rents.</text>
<text x="20" y="444" fill="#fca5a5" font-family="Menlo, monospace" font-size="13">&#160;&#160;&#160;verdict:&#160;mixedSentences&#160;(line-level&#160;FAIL,&#160;word-level&#160;pass)</text>
<text x="20" y="468" fill="#fde68a" font-family="Menlo, monospace" font-size="13">&#160;&#160;&#160;note:&#160;1&#160;of&#160;3&#160;sentences&#160;is&#160;in&#160;English,&#160;not&#160;French&#160;(you&#160;wrote&#160;in&#160;French):&#160;&#8220;In&#160;practice,&#160;you&#160;should&#160;use&#160;a&#160;tuple&#160;when&#160;t&#8230;</text>
<text x="20" y="492" fill="#e2e8f0" font-family="Menlo, monospace" font-size="13">&#160;&#160;&#160;Q:&#160;&#1042;&#160;&#1095;&#1105;&#1084;&#160;&#1088;&#1072;&#1079;&#1085;&#1080;&#1094;&#1072;&#160;&#1084;&#1077;&#1078;&#1076;&#1091;&#160;&#1089;&#1087;&#1080;&#1089;&#1082;&#1086;&#1084;&#160;&#1080;&#160;&#1082;&#1086;&#1088;&#1090;&#1077;&#1078;&#1077;&#1084;&#160;&#1074;&#160;Python?</text>
<text x="20" y="516" fill="#e2e8f0" font-family="Menlo, monospace" font-size="13">&#160;&#160;&#160;A:&#160;&#1057;&#1087;&#1080;&#1089;&#1086;&#1082;&#160;&#1084;&#1086;&#1078;&#1085;&#1086;&#160;&#1080;&#1079;&#1084;&#1077;&#1085;&#1080;&#1090;&#1100;,&#160;&#1072;&#160;&#1082;&#1086;&#1088;&#1090;&#1077;&#1078;&#160;&#1085;&#1077;&#1083;&#1100;&#1079;&#1103;.&#160;&#1069;&#1090;&#1086;&#160;&#1093;&#1086;&#1088;&#1086;&#1096;&#1080;&#1081;&#160;&#1074;&#1086;&#1087;&#1088;&#1086;&#1089;,&#160;however&#160;&#1074;&#1089;&#1105;&#160;&#1079;&#1072;&#1074;&#1080;&#1089;&#1080;&#1090;&#160;&#1086;&#1090;&#160;&#1079;&#1072;&#1076;&#1072;&#1095;&#1080;.</text>
<text x="20" y="540" fill="#e2e8f0" font-family="Menlo, monospace" font-size="13">&#160;&#160;&#160;expected&#160;Russian&#160;because&#160;you&#160;wrote&#160;in&#160;Russian</text>
<text x="20" y="564" fill="#bbf7d0" font-family="Menlo, monospace" font-size="13">&#160;&#160;&#160;ok,&#160;Russian&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#1057;&#1087;&#1080;&#1089;&#1086;&#1082;&#160;&#1084;&#1086;&#1078;&#1085;&#1086;&#160;&#1080;&#1079;&#1084;&#1077;&#1085;&#1080;&#1090;&#1100;,&#160;&#1072;&#160;&#1082;&#1086;&#1088;&#1090;&#1077;&#1078;&#160;&#1085;&#1077;&#1083;&#1100;&#1079;&#1103;.</text>
<text x="20" y="588" fill="#bbf7d0" font-family="Menlo, monospace" font-size="13">&#160;&#160;&#160;ok,&#160;Russian&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#1069;&#1090;&#1086;&#160;&#1093;&#1086;&#1088;&#1086;&#1096;&#1080;&#1081;&#160;&#1074;&#1086;&#1087;&#1088;&#1086;&#1089;,&#160;however&#160;&#1074;&#1089;&#1105;&#160;&#1079;&#1072;&#1074;&#1080;&#1089;&#1080;&#1090;&#160;&#1086;&#1090;&#160;&#1079;&#1072;&#1076;&#1072;&#1095;&#1080;.</text>
<text x="20" y="612" fill="#fdba74" font-family="Menlo, monospace" font-size="13">&#160;&#160;&#160;stray,&#160;English&#160;word&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;however</text>
<text x="20" y="636" fill="#fca5a5" font-family="Menlo, monospace" font-size="13">&#160;&#160;&#160;verdict:&#160;strayWords&#160;(line-level&#160;pass,&#160;word-level&#160;FAIL)</text>
<text x="20" y="660" fill="#e2e8f0" font-family="Menlo, monospace" font-size="13"></text>
<text x="20" y="684" fill="#7dd3fc" font-family="Menlo, monospace" font-size="13">&#9472;&#9472;&#160;2.&#160;A&#160;request&#160;sets&#160;the&#160;language;&#160;a&#160;mention&#160;only&#160;allows&#160;one</text>
<text x="20" y="708" fill="#e2e8f0" font-family="Menlo, monospace" font-size="13">&#160;&#160;&#160;Q:&#160;Answer&#160;in&#160;Spanish:&#160;what&#160;is&#160;the&#160;capital&#160;of&#160;Australia?</text>
<text x="20" y="732" fill="#e2e8f0" font-family="Menlo, monospace" font-size="13">&#160;&#160;&#160;A:&#160;The&#160;capital&#160;of&#160;Australia&#160;is&#160;Canberra,&#160;not&#160;Sydney.</text>
<text x="20" y="756" fill="#e2e8f0" font-family="Menlo, monospace" font-size="13">&#160;&#160;&#160;expected&#160;Spanish&#160;because&#160;you&#160;asked&#160;for&#160;an&#160;answer&#160;in&#160;Spanish</text>
<text x="20" y="780" fill="#fca5a5" font-family="Menlo, monospace" font-size="13">&#160;&#160;&#160;WRONG,&#160;English&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;The&#160;capital&#160;of&#160;Australia&#160;is&#160;Canberra,&#160;not&#160;Sydney.</text>
